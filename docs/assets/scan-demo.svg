<svg xmlns="http://www.w3.org/2000/svg" width="900" height="446" viewBox="0 0 900 446" role="img" aria-labelledby="tt td">
  <title id="tt">ReconLens scan, illustrative run</title>
  <desc id="td">An animated terminal showing the stages of a passive ReconLens scan finishing one after another, ending in a risk score and exports. Values are illustrative.</desc>
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1626"/><stop offset="1" stop-color="#050a14"/></linearGradient>
  </defs>
  <rect width="900" height="446" rx="14" fill="url(#tb)"/>
  <rect x="0.5" y="0.5" width="899" height="445" rx="14" fill="none" stroke="#1e3a5f"/>
  <path d="M0 14A14 14 0 0 1 14 0H886A14 14 0 0 1 900 14V40H0Z" fill="#0f1f35"/>
  <circle cx="24" cy="20" r="6" fill="#f87171"/><circle cx="44" cy="20" r="6" fill="#fbbf24"/><circle cx="64" cy="20" r="6" fill="#34d399"/>
  <text x="450" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748b">reconlens — passive scan (illustrative output)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <text x="28" y="78" opacity="1" xml:space="preserve"><tspan fill="#34d399">$ </tspan><tspan fill="#e2e8f0">reconlens scan </tspan><tspan fill="#67e8f9">target.com</tspan><tspan fill="#64748b">   # authorization confirmed 14:02 UTC</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0143;0.0343;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="104" opacity="1" xml:space="preserve"><tspan fill="#64748b">  ssrf-guard   </tspan><tspan fill="#e2e8f0">resolved 2 A records, all public</tspan><tspan fill="#34d399">  ok</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0714;0.0914;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="130" opacity="1" xml:space="preserve"><tspan fill="#34d399">  ✓ </tspan><tspan fill="#e2e8f0">DNS records        </tspan><tspan fill="#64748b">SOA · DNSSEC · SRV · PTR · wildcard   </tspan><tspan fill="#67e8f9">2.3s</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1214;0.1414;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="156" opacity="1" xml:space="preserve"><tspan fill="#34d399">  ✓ </tspan><tspan fill="#e2e8f0">Cert transparency  </tspan><tspan fill="#64748b">crt.sh  </tspan><tspan fill="#67e8f9">27 subdomains</tspan><tspan fill="#64748b"> (incl. expired certs)</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1714;0.1914;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="182" opacity="1" xml:space="preserve"><tspan fill="#34d399">  ✓ </tspan><tspan fill="#e2e8f0">Takeover / dangling</tspan><tspan fill="#64748b"> 25 CNAMEs checked  </tspan><tspan fill="#34d399">0 dangling</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2214;0.2414;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="208" opacity="1" xml:space="preserve"><tspan fill="#fbbf24">  ! </tspan><tspan fill="#e2e8f0">HTTP security      </tspan><tspan fill="#fbbf24">HSTS, CSP, X-Frame-Options missing</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2714;0.2914;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="234" opacity="1" xml:space="preserve"><tspan fill="#fbbf24">  ! </tspan><tspan fill="#e2e8f0">Email security     </tspan><tspan fill="#fbbf24">DMARC p=none  →  domain can be spoofed</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3214;0.3414;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="260" opacity="1" xml:space="preserve"><tspan fill="#f87171">  ✗ </tspan><tspan fill="#e2e8f0">Tech stack → CVEs  </tspan><tspan fill="#f87171">nginx 1.18.0  3 CVEs · 1 in CISA KEV</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3714;0.3914;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="286" opacity="1" xml:space="preserve"><tspan fill="#fbbf24">  ! </tspan><tspan fill="#e2e8f0">JavaScript         </tspan><tspan fill="#64748b">10 scripts  </tspan><tspan fill="#fbbf24">1 key (AIza…Xk2Q, masked) · 2 buckets</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4214;0.4414;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="312" opacity="1" xml:space="preserve"><tspan fill="#34d399">  ✓ </tspan><tspan fill="#e2e8f0">Origin hints       </tspan><tspan fill="#64748b">mail.target.com resolves outside the CDN</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4714;0.4914;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="338" opacity="1" xml:space="preserve"><tspan fill="#c4b5fd">  ◆ </tspan><tspan fill="#e2e8f0">Risk score  </tspan><tspan fill="#fbbf24">███████████░░░░░░░░░  58 / 100  HIGH</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5286;0.5486;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="364" opacity="1" xml:space="preserve"><tspan fill="#c4b5fd">  ◆ </tspan><tspan fill="#e2e8f0">AI report   </tspan><tspan fill="#64748b">summary · prioritized findings · attack paths</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5857;0.6057;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  <text x="28" y="390" opacity="1" xml:space="preserve"><tspan fill="#34d399">$ </tspan><tspan fill="#64748b">export  </tspan><tspan fill="#67e8f9">json  csv  markdown  pdf  share-link</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6429;0.6629;0.93;1" dur="14.0s" repeatCount="indefinite"/></text>
  </g>
  <rect x="28" y="400" width="9" height="3" fill="#67e8f9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
