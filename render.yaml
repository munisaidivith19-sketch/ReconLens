# Render Blueprint: https://render.com/docs/blueprint-spec
# Two free services: the FastAPI backend and the static React frontend.
# If Render gives your services different URLs, update VITE_API_URL, FRONTEND_ORIGIN
# and the connect-src entry in the frontend Content-Security-Policy below.

services:
  - type: web
    name: reconlens-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.18
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: reconlens
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: VT_API_KEY
        sync: false
      - key: NVD_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DAILY_SCAN_LIMIT
        value: "10"
      - key: MAX_CONCURRENT_SCANS
        value: "2"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: reconlens
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://reconlens-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://reconlens-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
